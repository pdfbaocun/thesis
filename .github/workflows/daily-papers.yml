name: Daily cornea & vitreous papers

on:
  schedule:
    # 毎日 6:43 JST (= 21:43 UTC)。GitHubの混雑で数分〜数十分遅れることがあります
    - cron: "43 21 * * *"
  # コードを変更したときは LINE に送らずに動作確認(dry run)だけ行う
  push:
    paths:
      - "paper_bot/**"
      - "requirements.txt"
      - ".github/workflows/daily-papers.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "LINEに送らずログに出力するだけ"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-papers
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick papers, summarize, and send to LINE
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          DRY_RUN: ${{ (github.event_name == 'push' || inputs.dry_run) && '1' || '0' }}
        run: python paper_bot/daily_papers.py

      - name: Record sent papers
        if: ${{ github.event_name != 'push' && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_pmids.json
          git diff --cached --quiet && exit 0
          git commit -m "Record papers sent on $(TZ=Asia/Tokyo date +%F)"
          git push
